name: Manual Test Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA)'
        required: true
        type: string
        default: 'fix/player-avatar-shrink'

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Build:
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-latest'
          - platform: 'windows-latest'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve build commit
        id: meta
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse HEAD | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform }}

      - name: Bump version for test build
        run: pnpm run version bump 0.0.1

      - name: Test Build
        run: pnpm tauri build --features devtools --no-bundle -- --profile test-build
        env:
          SJMCL_CURSEFORGE_API_KEY: ${{ secrets.SJMCL_CURSEFORGE_API_KEY }}
          SJMCL_BUILD_TYPE: test-build
          SJMCL_COMMIT_SHA: ${{ steps.meta.outputs.sha }}

      - name: Build portable artifact
        id: portable
        shell: bash
        run: |
          mkdir -p artifacts
          SHORT_SHA="${{ steps.meta.outputs.short_sha }}"
          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            OUTPUT_NAME="SJMCL_${SHORT_SHA}_windows_x86_64_portable.exe"
            python scripts/release/bundle_portable_assets.py -p "src-tauri/target/test-build/" -o "$OUTPUT_NAME" "SJMCL.exe"
          else
            OUTPUT_NAME="SJMCL_${SHORT_SHA}_linux_x86_64_portable"
            python scripts/release/bundle_portable_assets.py -p "src-tauri/target/test-build/" -o "$OUTPUT_NAME" "SJMCL"
          fi
          cp "src-tauri/target/test-build/$OUTPUT_NAME" artifacts/
          echo "output_name=$OUTPUT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.portable.outputs.output_name }}
          path: artifacts/${{ steps.portable.outputs.output_name }}
          archive: false
          if-no-files-found: error
